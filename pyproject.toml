[project]
name = "gaswatch"
version = "0.1.0"
description = "Read-only EIP-1559 gas estimator from eth_feeHistory (stdlib-only Python CLI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "agenticspring" }]
keywords = ["ethereum", "gas", "eip-1559", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
gaswatch = "gaswatch.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gaswatch*"]
